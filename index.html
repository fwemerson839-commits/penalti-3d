<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pênalti 3D Teste</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#071d35;font-family:Arial;color:white}canvas{display:block;width:100vw;height:100vh;touch-action:none}#h{position:fixed;top:18px;width:100%;text-align:center;text-shadow:0 2px 4px #000;font-weight:bold}#tip{position:fixed;bottom:18px;left:15px;right:15px;text-align:center;background:#0009;padding:10px;border-radius:12px}</style></head><body><canvas id="c"></canvas><div id="h">PÊNALTI 3D — Gols: <span id="s">0</span></div><div id="tip">Toque dentro do gol para chutar</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),S=document.querySelector('#s');let W,H,b,k,shot,g=0;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;reset()}addEventListener('resize',rs);
function reset(){b={x:W/2,y:H*.82,vx:0,vy:0,r:18};k={x:W/2,y:H*.43,tx:W/2};shot=false}
function field(){let q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,'#68a9dc');q.addColorStop(.35,'#b9def1');q.addColorStop(.351,'#166b31');q.addColorStop(1,'#0b4d24');x.fillStyle=q;x.fillRect(0,0,W,H);x.fillStyle='#ffffff18';for(let i=0;i<8;i++){x.beginPath();x.moveTo(W/2,H*.35);x.lineTo(i*W/7,H);x.lineTo((i+1)*W/7,H);x.fill()}let L=W*.18,R=W*.82,T=H*.27,B=H*.54;x.strokeStyle='white';x.lineWidth=6;x.strokeRect(L,T,R-L,B-T);x.lineWidth=1;x.strokeStyle='#ffffff55';for(let i=1;i<9;i++){let xx=L+(R-L)*i/9;x.beginPath();x.moveTo(xx,T);x.lineTo(xx,B);x.stroke()}for(let i=1;i<5;i++){let yy=T+(B-T)*i/5;x.beginPath();x.moveTo(L,yy);x.lineTo(R,yy);x.stroke()}return {L,R,T,B}}
function draw(){x.clearRect(0,0,W,H);let G=field();x.strokeStyle='#ffd21f';x.lineWidth=10;x.lineCap='round';x.beginPath();x.moveTo(k.x,k.y-30);x.lineTo(k.x,k.y+25);x.moveTo(k.x,k.y-12);x.lineTo(k.x-45,k.y+2);x.moveTo(k.x,k.y-12);x.lineTo(k.x+45,k.y+2);x.moveTo(k.x,k.y+25);x.lineTo(k.x-22,k.y+58);x.moveTo(k.x,k.y+25);x.lineTo(k.x+22,k.y+58);x.stroke();x.fillStyle='#e5a77b';x.beginPath();x.arc(k.x,k.y-45,15,0,7);x.fill();x.fillStyle='#0005';x.beginPath();x.ellipse(b.x,b.y+12,b.r,7,0,0,7);x.fill();x.fillStyle='white';x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.stroke();x.fillStyle='#111';x.beginPath();x.arc(b.x,b.y,5,0,7);x.fill();requestAnimationFrame(loop)}
function loop(){if(shot){k.x+=(k.tx-k.x)*.08;b.x+=b.vx;b.y+=b.vy;b.r=Math.max(7,b.r*.982);if(b.y<H*.42){let save=Math.abs(b.x-k.x)<55;if(!save&&b.x>W*.18&&b.x<W*.82){g++;S.textContent=g}setTimeout(reset,450);shot=false}}draw()}
c.addEventListener('pointerdown',e=>{if(shot)return;let tx=e.clientX,ty=Math.max(H*.29,Math.min(H*.51,e.clientY));b.vx=(tx-b.x)/38;b.vy=(ty-b.y)/38;k.tx=Math.max(W*.23,Math.min(W*.77,tx+(Math.random()-.5)*160));shot=true});rs();
</script></body></html>
